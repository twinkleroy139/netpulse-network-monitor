<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NetPulse - Enterprise Network & VoIP Monitoring</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script type="text/javascript" src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-[#0b101e] text-slate-200 antialiased h-screen flex overflow-hidden">

    <!-- ========== SIDEBAR (PERMANENT SHELL) ========== -->
    <aside class="w-64 bg-[#111827] border-r border-slate-800 flex flex-col z-10 hidden md:flex h-full">
        <div class="p-5 flex items-center gap-3 border-b border-slate-800">
            <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-blue-500 to-cyan-400 flex items-center justify-center">
                <i class="fas fa-wave-square text-white text-sm"></i>
            </div>
            <div>
                <h1 class="text-lg font-bold tracking-tight text-white">NetPulse</h1>
                <p class="text-[10px] text-slate-400 uppercase tracking-wider">Network & VoIP Monitoring</p>
            </div>
        </div>

        <nav class="flex-1 px-3 py-4 space-y-1 text-sm font-medium overflow-y-auto">
            <a href="#" id="nav-dashboard" class="nav-link flex items-center gap-3 px-3 py-2.5 rounded-lg bg-blue-500/10 text-blue-400 border-l-2 border-blue-500 transition">
                <i class="fas fa-chart-pie w-4"></i> Dashboard
            </a>
            
            <a href="#" id="nav-local-node" class="nav-link flex items-center gap-3 px-3 py-2.5 rounded-lg text-emerald-400 hover:text-emerald-300 transition mt-2 mb-2 border-l-2 border-transparent">
                <i class="fas fa-laptop-code w-4"></i> My Local Node
            </a>

            <a href="#" id="nav-agents" class="nav-link flex items-center gap-3 px-3 py-2.5 rounded-lg text-slate-400 hover:text-slate-200 hover:bg-slate-800/50 transition border-l-2 border-transparent">
                <i class="fas fa-server w-4"></i> Agents
            </a>
            
            <!-- NEW VOIP QUALITY TAB (For later) -->
            <a href="#" id="nav-voip" class="nav-link flex items-center gap-3 px-3 py-2.5 rounded-lg text-slate-400 hover:text-slate-200 hover:bg-slate-800/50 transition border-l-2 border-transparent">
                <i class="fas fa-phone-volume w-4"></i> VoIP Quality
            </a>

            <a href="#" id="nav-reports" class="nav-link flex items-center gap-3 px-3 py-2.5 rounded-lg text-slate-400 hover:text-slate-200 hover:bg-slate-800/50 transition border-l-2 border-transparent">
                <i class="fas fa-file-alt w-4"></i> Reports
            </a>
        </nav>
    </aside>

    <!-- ========== MAIN CONTENT AREA ========== -->
    <main class="flex-1 overflow-y-auto flex flex-col relative">
        <header class="px-6 py-4 flex items-center justify-between border-b border-slate-800/60 bg-[#0b101e]/90 sticky top-0 z-20 backdrop-blur-sm">
            <div class="flex items-center gap-3 text-sm text-emerald-400">
                <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse shadow-[0_0_8px_#34d399]"></span>
                Live Monitoring
            </div>
            
            <div class="flex items-center gap-4">
                 <div class="text-sm text-slate-400 font-mono" id="current-time">--:--:--</div>
                 <div id="auth-header-container">
                     <a href="login.html" id="btn-demo-login" class="bg-blue-600/20 text-blue-400 hover:bg-blue-600/40 border border-blue-500/50 font-medium text-xs px-4 py-2 rounded transition flex items-center gap-2">
                         <i class="fas fa-sign-in-alt"></i> Login / Sign Up
                     </a>
                     
                     <div id="logged-in-nav" class="hidden flex gap-3">
                         <button id="btn-profile" class="bg-slate-800 text-slate-300 hover:text-white border border-slate-700 font-medium text-xs px-4 py-2 rounded transition">
                            <i class="fas fa-user mr-1"></i> Profile Hub
                         </button>
                         <button id="btn-signout" class="text-slate-400 hover:text-rose-400 font-medium text-xs px-4 py-2 transition">
                            Sign Out
                         </button>
                     </div>
                 </div>
            </div>
        </header>

        <!-- DYNAMIC VIEWS WILL BE INJECTED HERE -->
        <div id="app-content" class="flex-1 w-full h-full"></div>
        
    </main>

    <script type="module" src="js/dashboard.js?v=3.0"></script>
</body>
</html>
