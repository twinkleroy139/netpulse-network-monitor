services:
  db:
    image: postgres:15-alpine
    container_name: netpulse_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-netpulse_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-netpulse_password}
      POSTGRES_DB: ${POSTGRES_DB:-netpulse_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U netpulse_user -d netpulse_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: